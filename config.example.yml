# Todoist CLI Configuration
# Copy this file to config.yml and customize

# API Token (optional): the TODOIST_API_TOKEN env var and the shared
# ~/.config/todoist/config.json ({"token": "..."}) are checked first.
# Get your token from: https://todoist.com/app/settings/integrations/developer
# api-token: your_token_here

# Shortcuts for fast input
shortcuts:
  # Label shortcuts: shortcut -> full label name
  labels:
    q: quick     # <= 10 minutes
    w: waiting

  # Project shortcuts: shortcut -> full project name
  projects:
    i: Inbox
    r: 🔬 Research
    t: 🎓 Teaching
    c: 🤝 Collabs
    s: 🏛 Service
    l: 🧰 Lab
    p: 🏠 Personal
    f: 💡 Someday
    u: 👥 Students

  # Priority shortcuts (optional)
  priorities:
    u: p1   # 'u' expands to p1 (the focus task)

# Note: The 'cached' section is auto-populated by 't sync'
# Do not edit manually
